name: multitask-road-vision-3d-CI

on:
    push:
        branches: [main]
        paths: ["web/**", ".github/workflows/ci.yml"]
    pull_request:
        paths: ["web/**", ".github/workflows/ci.yml"]

jobs:
    build:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: web
        
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '20'
            - name: Run CI
              run: npm ci
            - name: eslint
              run: npm run lint
            - name: Run Build
              run: npm run build