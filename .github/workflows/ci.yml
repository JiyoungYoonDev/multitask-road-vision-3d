name: multitask-road-vision-3d-CI

on:
    push:
        branches: [main]
        paths: ["web/**"]
    pull_request:
        paths: ["web/**"]

jobs:
    build:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: web
        
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '20'
            - name: Install dependencies
              run: npm install
            - name: Run CI
              run: npm ci
            - name: eslint
              run: npm run init
            - name: Type check
              run: npx tsc --noEmit
            - name: Run Build
              run: npm run build